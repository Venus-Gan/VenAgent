name: venagent

services:
  postgres:
    image: postgres:16-alpine
    mem_limit: 512m
    environment:
      # 应用配置唯一来源是 config.yaml；容器初始化密码通过变量覆盖，
      # 未提供时使用本地开发默认值（与 config.example.yaml 占位语义一致）。
      POSTGRES_DB: venagent
      POSTGRES_USER: venagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-venagent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - venagent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26.0-community
    mem_limit: 1g
    environment:
      NEO4J_AUTH: ${NEO4J__USER:-neo4j}/${NEO4J_PASSWORD:-neo4j}
      # 本地开发内存受限：显式压堆与 page cache，避免 JVM 自适应撑爆 WSL2。
      NEO4J_server_jvm_additional: -Xms256m -Xmx512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - venagent-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # M08 RAG 三路检索基础设施：Milvus（dense 向量路）依赖 etcd+MinIO。
  # 参照官方 milvus-standalone-docker-compose.yml（etcd/minio/milvus 三容器）。
  etcd:
    # quay.io 不走 Docker Hub 加速器，使用 DaoCloud 多 registry 加速前缀。
    image: m.daocloud.io/quay.io/coreos/etcd:v3.5.5
    mem_limit: 256m
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - venagent-etcd-data:/etcd
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    mem_limit: 512m
    environment:
      MINIO_ACCESS_KEY: ${MILVUS_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MILVUS_MINIO_SECRET_KEY:-minioadmin}
    command: minio server /minio_data
    volumes:
      - venagent-minio-data:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  milvus:
    # 镜像源可插拔（ES_IMAGE/MILVUS_IMAGE 覆盖）；默认走本机实测可完整拉取的
    # DaoCloud 多 registry 加速前缀（1ms.run 等快源大文件回源 cloudfront 会断流）。
    image: ${MILVUS_IMAGE:-m.daocloud.io/docker.io/milvusdb/milvus:v2.4.0}
    mem_limit: 2g
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:${MILVUS_METRICS_PORT:-9091}:9091"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/19530 && echo ok"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    restart: unless-stopped

  # M08 RAG keyword 路：Elasticsearch 8 单节点（本地开发关闭安全）。
  # docker.elastic.co 不可达；镜像源可插拔（ES_IMAGE 覆盖），默认 DaoCloud 加速前缀。
  es:
    image: ${ES_IMAGE:-m.daocloud.io/docker.io/library/elasticsearch:8.15.5}
    mem_limit: 1g
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${ES_PORT:-9200}:9200"
    volumes:
      - venagent-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    restart: unless-stopped

volumes:
  venagent-postgres-data:
  venagent-neo4j-data:
  venagent-etcd-data:
  venagent-minio-data:
  venagent-es-data:
